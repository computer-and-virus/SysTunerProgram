name: Slash Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]

jobs:
  slash-commands:
    if: |
      (github.event.issue || github.event.discussion) &&
      (github.event.comment.body == '/关闭提交重复' ||
       github.event.comment.body == '/关闭提交放弃' ||
       github.event.comment.body == '/关闭提交完成' ||
       startsWith(github.event.comment.body, '/开始处理 ') ||
       github.event.comment.body == '/开始处理' ||
       github.event.comment.body == '/提交完成' ||
       github.event.comment.body == '/挂起提交' ||
       github.event.comment.body == '/开启提交' ||
       github.event.comment.body == '/关闭提交合并' ||
       github.event.comment.body == '/等待提交者' ||
       github.event.comment.body == '/暂无计划' ||
       github.event.comment.body == '/关闭评论区' ||
       github.event.comment.body == '/开启评论区' ||
       github.event.comment.body == '/关闭对话过时' ||
       github.event.comment.body == '/关闭对话完成' ||
       github.event.comment.body == '/关闭对话重复' ||
       startsWith(github.event.comment.body, '/增加标签 ') ||
       startsWith(github.event.comment.body, '/移除标签 ') ||
       startsWith(github.event.comment.body, '/增加并更改标签 '))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write

    steps:
      - name: 检查管理员权限
        id: check_permission
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              if (username === owner) {
                core.setOutput('isAdmin', 'true');
                return;
              }
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username
              });
              const perm = permission.data.permission;
              if (perm === 'admin' || perm === 'write') {
                core.setOutput('isAdmin', 'true');
              } else {
                core.setOutput('isAdmin', 'false');
                core.setOutput('errorMsg', `用户 ${username} 没有管理员权限（当前权限：${perm}），无法执行斜杠命令。`);
              }
            } catch (error) {
              core.setOutput('isAdmin', 'false');
              core.setOutput('errorMsg', `用户 ${username} 不是仓库协作者，无法执行斜杠命令。`);
            }

      - name: 权限不足提示
        if: steps.check_permission.outputs.isAdmin == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = context.payload.comment.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const errorMsg = process.env.ERROR_MSG || '权限不足，只有仓库管理员可以执行此命令。';
            
            if (context.payload.issue) {
              await github.rest.reactions.createForIssueComment({
                owner, repo,
                comment_id: commentId,
                content: 'confused'
              });
            } else if (context.payload.discussion) {
              await github.rest.reactions.createForDiscussionComment({
                owner, repo,
                comment_id: commentId,
                content: 'confused'
              });
            }
        env:
          ERROR_MSG: ${{ steps.check_permission.outputs.errorMsg }}

      - name: 处理斜杠命令
        if: steps.check_permission.outputs.isAdmin == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isDiscussion = !!context.payload.discussion;
            const isPR = !!context.payload.issue?.pull_request;
            
            const targetNumber = context.payload.issue?.number || context.payload.discussion?.number;

            // ==================== 标签定义 ====================
            const keepLabels = [
              'BUG', '优化', '其它', '初始化', '新功能', '未分类',
              '菜单功能', '菜单界面', '🔒评论区已锁定🔒', '版本介绍', '公告', '指引'
            ];

            const priorityLabels = {
              0: '⚡优先度：小更改⚡',
              1: '🟢优先度：低🟢',
              2: '🟡优先度：中🟡',
              3: '🔴优先度：高🔴',
              4: '🔥优先度：极高🔥'
            };

            // ==================== GraphQL 辅助函数 ====================
            async function getDiscussionId() {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      id
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              console.log('getDiscussionId:', JSON.stringify(result, null, 2));
              return result.repository.discussion.id;
            }

            async function getRepositoryId() {
              const query = `
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    id
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo });
              return result.repository.id;
            }

            // ==================== 获取仓库级别所有标签 ====================
            async function getRepositoryLabels() {
              const query = `
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    labels(first: 100) {
                      nodes {
                        id
                        name
                      }
                    }
                  }
                }
              `;
              try {
                const result = await github.graphql(query, { owner, repo });
                return result.repository.labels.nodes || [];
              } catch (e) {
                console.log('获取仓库标签失败:', e.message);
                return [];
              }
            }

            // ==================== Discussion 标签操作（GraphQL） ====================
            async function discussionAddLabels(labels) {
              const filtered = labels.filter(l => l && l.length > 0);
              if (filtered.length === 0) return;

              const labelableId = await getDiscussionId();
              console.log('labelableId:', labelableId);
              console.log('要添加的标签:', filtered);

              const repoLabels = await getRepositoryLabels();
              console.log('仓库已有标签:', repoLabels.map(l => l.name));

              const labelIds = [];
              const repositoryId = await getRepositoryId();

              for (const labelName of filtered) {
                let existing = repoLabels.find(l => l.name === labelName);
                if (existing) {
                  console.log('标签已存在，直接使用:', labelName, 'ID:', existing.id);
                  labelIds.push(existing.id);
                  continue;
                }

                const color = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                const createMutation = `
                  mutation($repositoryId: ID!, $name: String!, $color: String!) {
                    createLabel(input: { repositoryId: $repositoryId, name: $name, color: $color }) {
                      label { id }
                    }
                  }
                `;
                try {
                  const createResult = await github.graphql(createMutation, {
                    repositoryId,
                    name: labelName,
                    color: color
                  });
                  const newLabel = createResult.createLabel.label;
                  console.log('创建标签成功:', labelName, 'ID:', newLabel.id);
                  labelIds.push(newLabel.id);
                } catch (createError) {
                  console.log('创建标签失败:', labelName, createError.message);
                  const refreshedLabels = await getRepositoryLabels();
                  const retryExisting = refreshedLabels.find(l => l.name === labelName);
                  if (retryExisting) {
                    console.log('重试成功，找到标签:', labelName, 'ID:', retryExisting.id);
                    labelIds.push(retryExisting.id);
                  } else {
                    console.log('标签创建失败且无法找回，跳过:', labelName);
                  }
                }
              }

              if (labelIds.length === 0) {
                console.log('没有标签可添加');
                return;
              }

              const mutation = `
                mutation($labelableId: ID!, $labelIds: [ID!]!) {
                  addLabelsToLabelable(input: {
                    labelableId: $labelableId,
                    labelIds: $labelIds
                  }) {
                    clientMutationId
                  }
                }
              `;
              const result = await github.graphql(mutation, { labelableId, labelIds });
              console.log('添加标签结果:', JSON.stringify(result, null, 2));
            }

            async function discussionRemoveLabel(label) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      labels(first: 100) {
                        nodes { id name }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              const targetLabel = result.repository.discussion.labels.nodes.find(l => l.name === label);
              if (targetLabel) {
                const labelableId = await getDiscussionId();
                const mutation = `
                  mutation($labelableId: ID!, $labelId: ID!) {
                    removeLabelsFromLabelable(input: {
                      labelableId: $labelableId,
                      labelIds: [$labelId]
                    }) {
                      clientMutationId
                    }
                  }
                `;
                await github.graphql(mutation, { labelableId, labelId: targetLabel.id });
                console.log('移除标签成功:', label);
              } else {
                console.log('标签不在当前 Discussion 上，无需移除:', label);
              }
            }

            async function discussionGetLabels() {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      labels(first: 100) {
                        nodes { name }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              return result.repository.discussion.labels.nodes.map(l => l.name);
            }

            // ==================== 关闭/开启 Discussion ====================
            async function closeDiscussionGraphQL() {
              const discussionId = await getDiscussionId();
              const mutation = `
                mutation($discussionId: ID!) {
                  closeDiscussion(input: { discussionId: $discussionId }) {
                    discussion {
                      id
                    }
                  }
                }
              `;
              const result = await github.graphql(mutation, { discussionId });
              console.log('关闭 Discussion 结果:', JSON.stringify(result, null, 2));
            }

            async function reopenDiscussionGraphQL() {
              const discussionId = await getDiscussionId();
              const mutation = `
                mutation($discussionId: ID!) {
                  reopenDiscussion(input: { discussionId: $discussionId }) {
                    discussion {
                      id
                    }
                  }
                }
              `;
              const result = await github.graphql(mutation, { discussionId });
              console.log('重新开启 Discussion 结果:', JSON.stringify(result, null, 2));
            }

            // ==================== 锁定/解锁 Discussion ====================
            async function discussionLock() {
              const discussionId = await getDiscussionId();
              const mutation = `
                mutation lock($discussionId: ID!) {
                  lockLockable(input: { lockableId: $discussionId }) {
                    lockedRecord {
                      locked
                      activeLockReason
                    }
                  }
                }
              `;
              const result = await github.graphql(mutation, { discussionId });
              console.log('锁定结果:', JSON.stringify(result, null, 2));
            }

            async function discussionUnlock() {
              const discussionId = await getDiscussionId();
              const mutation = `
                mutation unlock($discussionId: ID!) {
                  unlockLockable(input: { lockableId: $discussionId }) {
                    unlockedRecord {
                      locked
                    }
                  }
                }
              `;
              const result = await github.graphql(mutation, { discussionId });
              console.log('解锁结果:', JSON.stringify(result, null, 2));
            }

            // ==================== API 适配器 ====================
            async function getCurrentLabels() {
              if (isDiscussion) {
                return await discussionGetLabels();
              } else {
                const result = await github.rest.issues.listLabelsOnIssue({
                  issue_number: targetNumber, owner, repo
                });
                return result.data.map(l => l.name);
              }
            }

            async function addLabelsOnly(labels) {
              const filtered = labels.filter(l => l && l.length > 0);
              if (filtered.length === 0) return;

              console.log('准备添加标签:', filtered);
              console.log('isDiscussion:', isDiscussion);
              console.log('targetNumber:', targetNumber);

              if (isDiscussion) {
                await discussionAddLabels(filtered);
              } else {
                await github.rest.issues.addLabels({
                  issue_number: targetNumber,
                  owner: owner,
                  repo: repo,
                  labels: filtered
                });
              }
            }

            async function removeLabelsOnly(labels) {
              for (const label of labels) {
                console.log('准备移除标签:', label);
                if (isDiscussion) {
                  await discussionRemoveLabel(label);
                } else {
                  await github.rest.issues.removeLabel({
                    issue_number: targetNumber,
                    owner: owner,
                    repo: repo,
                    name: label
                  }).catch(() => {});
                }
              }
            }

            async function setLabels(newLabels) {
              const current = await getCurrentLabels();
              for (const label of current) {
                if (!keepLabels.includes(label)) {
                  if (isDiscussion) {
                    await discussionRemoveLabel(label);
                  } else {
                    await github.rest.issues.removeLabel({
                      issue_number: targetNumber, owner, repo,
                      name: label
                    }).catch(() => {});
                  }
                }
              }
              const filtered = newLabels.filter(l => l && l.length > 0);
              if (filtered.length > 0) {
                if (isDiscussion) {
                  await discussionAddLabels(filtered);
                } else {
                  await github.rest.issues.addLabels({
                    issue_number: targetNumber, owner, repo,
                    labels: filtered
                  });
                }
              }
            }

            async function lockComments() {
              if (isDiscussion) {
                await discussionLock();
              } else {
                await github.rest.issues.lock({
                  issue_number: targetNumber, owner, repo,
                  lock_reason: 'resolved'
                });
              }
            }

            async function unlockComments() {
              if (isDiscussion) {
                await discussionUnlock();
              } else {
                await github.rest.issues.unlock({
                  issue_number: targetNumber, owner, repo
                });
              }
            }

            async function closeIssue(state, closeLabel) {
              await setLabels(['⛔关闭⛔', closeLabel]);
              if (isDiscussion) {
                await closeDiscussionGraphQL();
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'closed',
                  state_reason: state || 'completed'
                });
              }
            }

            async function reopenIssue() {
              if (isDiscussion) {
                await reopenDiscussionGraphQL();
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'open'
                });
              }
            }

            // ==================== 命令处理 ====================
            const body = comment.trim();

            console.log('收到命令:', body);
            console.log('isDiscussion:', isDiscussion);
            console.log('targetNumber:', targetNumber);

            if (body === '/关闭提交重复') {
              await closeIssue('duplicate', '🔁重复🔁');
              return;
            }

            if (body === '/关闭提交放弃') {
              await closeIssue('not_planned', '🙅拒绝 / 放弃🙅');
              return;
            }

            if (body === '/关闭提交完成') {
              await closeIssue('completed', '✅完成且已应用✅');
              return;
            }

            if (body === '/提交完成') {
              await setLabels(['⏳完成但未应用⏳']);
              return;
            }

            if (body === '/挂起提交') {
              await setLabels(['⏸️挂起⏸️']);
              return;
            }

            if (body === '/开始处理') {
              await setLabels(['🔧处理中🔧']);
              return;
            }

            if (body.startsWith('/开始处理 ')) {
              const parts = body.split(' ');
              const num = parseInt(parts[1]);
              if (isNaN(num) || num < 0 || num > 4) {
                await setLabels(['🔧处理中🔧']);
              } else {
                const priorityLabel = priorityLabels[num];
                const finalLabels = ['🔧处理中🔧'];
                if (priorityLabel) finalLabels.push(priorityLabel);
                await setLabels(finalLabels);
              }
              return;
            }

            if (body === '/开启提交') {
              await setLabels(['🕐等待处理🕐']);
              await reopenIssue();
              return;
            }

            if (body === '/关闭提交合并') {
              await closeIssue('completed', '🔀合并🔀');
              return;
            }

            if (body === '/等待提交者') {
              await setLabels(['🧑‍💻等待提交者🧑‍💻']);
              return;
            }

            if (body === '/暂无计划') {
              await setLabels(['🗓️暂无计划🗓️']);
              return;
            }

            if (body === '/关闭评论区') {
              console.log('执行 /关闭评论区 命令');
              await addLabelsOnly(['🔒评论区已锁定🔒']);
              await lockComments();
              return;
            }

            if (body === '/开启评论区') {
              console.log('执行 /开启评论区 命令');
              await removeLabelsOnly(['🔒评论区已锁定🔒']);
              await unlockComments();
              return;
            }

            // ==================== 新增三个 Discussion 专用命令 ====================
            if (body === '/关闭对话过时') {
              console.log('执行 /关闭对话过时 命令');
              await setLabels(['⛔关闭⛔', '🕰️过时🕰️']);
              if (isDiscussion) {
                await closeDiscussionGraphQL();
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
              }
              return;
            }

            if (body === '/关闭对话完成') {
              console.log('执行 /关闭对话完成 命令');
              if (isDiscussion) {
                await closeDiscussionGraphQL();
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'closed',
                  state_reason: 'completed'
                });
              }
              return;
            }

            if (body === '/关闭对话重复') {
              console.log('执行 /关闭对话重复 命令');
              await addLabelsOnly(['🔁重复🔁']);
              if (isDiscussion) {
                await closeDiscussionGraphQL();
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'closed',
                  state_reason: 'duplicate'
                });
              }
              return;
            }

            if (body.startsWith('/增加标签 ')) {
              const labelPart = body.substring('/增加标签 '.length).trim();
              const labels = labelPart.split(/\s+/).filter(l => l.length > 0);
              if (labels.length > 0) {
                await addLabelsOnly(labels);
              }
              return;
            }

            if (body.startsWith('/移除标签 ')) {
              const labelPart = body.substring('/移除标签 '.length).trim();
              const labels = labelPart.split(/\s+/).filter(l => l.length > 0);
              if (labels.length > 0) {
                await removeLabelsOnly(labels);
              }
              return;
            }

            if (body.startsWith('/增加并更改标签 ')) {
              const parts = body.substring('/增加并更改标签 '.length).trim().split(/\s+/);
              if (parts.length >= 2) {
                const oldLabel = parts[0];
                const newLabel = parts[1];
                await removeLabelsOnly([oldLabel]);
                await addLabelsOnly([newLabel]);
              }
              return;
            }

            console.log('未匹配任何命令');
