name: Slash Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]

jobs:
  slash-commands:
    if: |
      (github.event.issue || github.event.discussion) &&
      (github.event.comment.body == '/关闭提交重复' ||
       github.event.comment.body == '/关闭提交放弃' ||
       github.event.comment.body == '/关闭提交完成' ||
       startsWith(github.event.comment.body, '/开始处理 ') ||
       github.event.comment.body == '/开始处理' ||
       github.event.comment.body == '/提交完成' ||
       github.event.comment.body == '/挂起提交' ||
       github.event.comment.body == '/开启提交' ||
       github.event.comment.body == '/关闭提交合并' ||
       github.event.comment.body == '/等待提交者' ||
       github.event.comment.body == '/暂无计划' ||
       github.event.comment.body == '/关闭评论区' ||
       github.event.comment.body == '/开启评论区' ||
       startsWith(github.event.comment.body, '/增加标签 ') ||
       startsWith(github.event.comment.body, '/移除标签 ') ||
       startsWith(github.event.comment.body, '/增加并更改标签 '))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write

    steps:
      - name: 检查管理员权限
        id: check_permission
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              if (username === owner) {
                core.setOutput('isAdmin', 'true');
                return;
              }
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username
              });
              const perm = permission.data.permission;
              if (perm === 'admin' || perm === 'write') {
                core.setOutput('isAdmin', 'true');
              } else {
                core.setOutput('isAdmin', 'false');
                core.setOutput('errorMsg', `用户 ${username} 没有管理员权限（当前权限：${perm}），无法执行斜杠命令。`);
              }
            } catch (error) {
              core.setOutput('isAdmin', 'false');
              core.setOutput('errorMsg', `用户 ${username} 不是仓库协作者，无法执行斜杠命令。`);
            }

      - name: 权限不足提示
        if: steps.check_permission.outputs.isAdmin == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = context.payload.comment.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const errorMsg = process.env.ERROR_MSG || '权限不足，只有仓库管理员可以执行此命令。';
            
            if (context.payload.issue) {
              await github.rest.reactions.createForIssueComment({
                owner, repo,
                comment_id: commentId,
                content: 'confused'
              });
            } else if (context.payload.discussion) {
              await github.rest.reactions.createForDiscussionComment({
                owner, repo,
                comment_id: commentId,
                content: 'confused'
              });
            }
        env:
          ERROR_MSG: ${{ steps.check_permission.outputs.errorMsg }}

      - name: 处理斜杠命令
        if: steps.check_permission.outputs.isAdmin == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isDiscussion = !!context.payload.discussion;
            const isPR = !!context.payload.issue?.pull_request;
            
            const targetNumber = context.payload.issue?.number || context.payload.discussion?.number;

            // ==================== 标签定义 ====================
            const keepLabels = [
              'BUG', '优化', '其它', '初始化', '新功能', '未分类',
              '菜单功能', '菜单界面', '🔒评论区已锁定🔒'
            ];

            const priorityLabels = {
              0: '⚡优先度：小更改⚡',
              1: '🟢优先度：低🟢',
              2: '🟡优先度：中🟡',
              3: '🔴优先度：高🔴',
              4: '🔥优先度：极高🔥'
            };
            const allPriorityLabels = Object.values(priorityLabels);

            // ==================== Discussion 标签操作（GraphQL） ====================
            async function discussionAddLabels(labels) {
              const mutation = `
                mutation($owner: String!, $repo: String!, $number: Int!, $labels: [String!]!) {
                  addLabelsToLabelable(input: {
                    labelableId: $labelableId,
                    labels: $labels
                  }) {
                    clientMutationId
                  }
                }
              `;
              // 先获取 Discussion 的 node_id
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      id
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              const labelableId = result.repository.discussion.id;
              
              for (const label of labels) {
                await github.graphql(mutation, {
                  labelableId,
                  labels: [label]
                }).catch(() => {});
              }
            }

            async function discussionRemoveLabel(label) {
              // 获取所有标签，找到要删除的标签的 node_id
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      labels(first: 100) {
                        nodes {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              const labels = result.repository.discussion.labels.nodes;
              const targetLabel = labels.find(l => l.name === label);
              if (targetLabel) {
                const mutation = `
                  mutation($labelableId: ID!, $labelId: ID!) {
                    removeLabelsFromLabelable(input: {
                      labelableId: $labelableId,
                      labelIds: [$labelId]
                    }) {
                      clientMutationId
                    }
                  }
                `;
                // 获取 Discussion 的 node_id
                const idQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      discussion(number: $number) {
                        id
                      }
                    }
                  }
                `;
                const idResult = await github.graphql(idQuery, { owner, repo, number: targetNumber });
                await github.graphql(mutation, {
                  labelableId: idResult.repository.discussion.id,
                  labelId: targetLabel.id
                }).catch(() => {});
              }
            }

            async function discussionGetLabels() {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      labels(first: 100) {
                        nodes {
                          name
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, number: targetNumber });
              return result.repository.discussion.labels.nodes.map(l => l.name);
            }

            // ==================== API 适配器 ====================
            async function getCurrentLabels() {
              if (isDiscussion) {
                return await discussionGetLabels();
              } else {
                const result = await github.rest.issues.listLabelsOnIssue({
                  issue_number: targetNumber, owner, repo
                });
                return result.data.map(l => l.name);
              }
            }

            async function setLabels(newLabels) {
              const current = await getCurrentLabels();
              for (const label of current) {
                if (!keepLabels.includes(label)) {
                  if (isDiscussion) {
                    await discussionRemoveLabel(label);
                  } else {
                    await github.rest.issues.removeLabel({
                      issue_number: targetNumber, owner, repo,
                      name: label
                    }).catch(() => {});
                  }
                }
              }
              const filtered = newLabels.filter(l => l && l.length > 0);
              if (filtered.length > 0) {
                if (isDiscussion) {
                  await discussionAddLabels(filtered);
                } else {
                  await github.rest.issues.addLabels({
                    issue_number: targetNumber, owner, repo,
                    labels: filtered
                  });
                }
              }
            }

            async function addLabelsOnly(labels) {
              const filtered = labels.filter(l => l && l.length > 0);
              if (filtered.length > 0) {
                if (isDiscussion) {
                  await discussionAddLabels(filtered);
                } else {
                  await github.rest.issues.addLabels({
                    issue_number: targetNumber, owner, repo,
                    labels: filtered
                  });
                }
              }
            }

            async function removeLabelsOnly(labels) {
              for (const label of labels) {
                if (isDiscussion) {
                  await discussionRemoveLabel(label);
                } else {
                  await github.rest.issues.removeLabel({
                    issue_number: targetNumber, owner, repo,
                    name: label
                  }).catch(() => {});
                }
              }
            }

            async function lockComments() {
              if (isDiscussion) {
                await github.rest.discussions.lock({
                  owner, repo,
                  discussion_number: targetNumber,
                  lock_reason: 'resolved'
                }).catch(() => {});
              } else {
                await github.rest.issues.lock({
                  issue_number: targetNumber, owner, repo,
                  lock_reason: 'resolved'
                }).catch(() => {});
              }
            }

            async function unlockComments() {
              if (isDiscussion) {
                await github.rest.discussions.unlock({
                  owner, repo,
                  discussion_number: targetNumber
                }).catch(() => {});
              } else {
                await github.rest.issues.unlock({
                  issue_number: targetNumber, owner, repo
                }).catch(() => {});
              }
            }

            async function closeIssue(state, closeLabel) {
              await setLabels(['⛔已关闭⛔', closeLabel]);
              if (isDiscussion) {
                await github.rest.discussions.update({
                  owner, repo,
                  discussion_number: targetNumber,
                  state: 'closed'
                });
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'closed',
                  state_reason: state || 'completed'
                });
              }
            }

            async function reopenIssue() {
              if (isDiscussion) {
                await github.rest.discussions.update({
                  owner, repo,
                  discussion_number: targetNumber,
                  state: 'open'
                });
              } else {
                await github.rest.issues.update({
                  issue_number: targetNumber, owner, repo,
                  state: 'open'
                });
              }
            }

            // ==================== 命令处理 ====================
            const body = comment.trim();

            if (body === '/关闭提交重复') {
              await closeIssue('duplicate', '🔁重复🔁');
              return;
            }

            if (body === '/关闭提交放弃') {
              await closeIssue('not_planned', '🙅拒绝 / 放弃🙅');
              return;
            }

            if (body === '/关闭提交完成') {
              await closeIssue('completed', '✅已完成且已应用✅');
              return;
            }

            if (body === '/提交完成') {
              await setLabels(['⏳已完成但未应用⏳']);
              return;
            }

            if (body === '/挂起提交') {
              await setLabels(['⏸️已挂起⏸️']);
              return;
            }

            if (body === '/开始处理') {
              await setLabels(['🔧处理中🔧']);
              return;
            }

            if (body.startsWith('/开始处理 ')) {
              const parts = body.split(' ');
              const num = parseInt(parts[1]);
              if (isNaN(num) || num < 0 || num > 4) {
                await setLabels(['🔧处理中🔧']);
              } else {
                const priorityLabel = priorityLabels[num] || '';
                const finalLabels = ['🔧处理中🔧'];
                if (priorityLabel) finalLabels.push(priorityLabel);
                await setLabels(finalLabels);
              }
              return;
            }

            if (body === '/开启提交') {
              await setLabels(['🕐等待处理🕐']);
              await reopenIssue();
              return;
            }

            if (body === '/关闭提交合并') {
              await closeIssue('completed', '🔀已合并🔀');
              return;
            }

            if (body === '/等待提交者') {
              await setLabels(['🧑‍💻等待提交者🧑‍💻']);
              return;
            }

            if (body === '/暂无计划') {
              await setLabels(['🗓️暂无计划🗓️']);
              return;
            }

            if (body === '/关闭评论区') {
              await addLabelsOnly(['🔒评论区已锁定🔒']);
              await lockComments();
              return;
            }

            if (body === '/开启评论区') {
              await removeLabelsOnly(['🔒评论区已锁定🔒']);
              await unlockComments();
              return;
            }

            if (body.startsWith('/增加标签 ')) {
              const labelPart = body.substring('/增加标签 '.length).trim();
              const labels = labelPart.split(/\s+/).filter(l => l.length > 0);
              if (labels.length > 0) {
                await addLabelsOnly(labels);
              }
              return;
            }

            if (body.startsWith('/移除标签 ')) {
              const labelPart = body.substring('/移除标签 '.length).trim();
              const labels = labelPart.split(/\s+/).filter(l => l.length > 0);
              if (labels.length > 0) {
                await removeLabelsOnly(labels);
              }
              return;
            }

            if (body.startsWith('/增加并更改标签 ')) {
              const parts = body.substring('/增加并更改标签 '.length).trim().split(/\s+/);
              if (parts.length >= 2) {
                const oldLabel = parts[0];
                const newLabel = parts[1];
                await removeLabelsOnly([oldLabel]);
                await addLabelsOnly([newLabel]);
              }
              return;
            }

            console.log('未匹配任何命令');
