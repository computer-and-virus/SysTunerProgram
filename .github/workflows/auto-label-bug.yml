name: Auto Label by Severity

on:
  issues:
    types: [opened]  # Issue 创建时触发

jobs:
  add-severity-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # 允许修改标签
    
    steps:
      - name: 根据BUG类型追加标签
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            // 定义严重程度 → 对应标签的映射
            const severityMap = [
              { keyword: '初始化问题（包括配置文件读取问题、PowerShell 安装问题等选择此选项）', label: '初始化' },
              { keyword: '菜单排版或显示问题（包括菜单主界面不显示问题，排版有错误问题等选择此选项）', label: '菜单界面' },
              { keyword: '功能问题（包括功能失效问题，功能显示问题等选择此选项）', label: '菜单功能' },
              { keyword: '其它问题（包括激活失败问题(前提是请将激活密文输入正确)，模式失效问题等选择此选项）', label: '其它' }
              { keyword: '无法判断（如果你无法判断当前BUG的位置，请选择此选项，并在描述问题环节详细讲述问题）', label: '未分类' }
            ];
            
            // 在 Issue 内容里查找匹配的选项
            let matchedLabel = null;
            for (const item of severityMap) {
              if (body.includes(item.keyword)) {
                matchedLabel = item.label;
                break;
              }
            }
            
            if (matchedLabel) {
              // 追加标签（不会覆盖已有标签）
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [matchedLabel]
              });
            }
